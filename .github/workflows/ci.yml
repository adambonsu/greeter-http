# .github/workflows/ci.yml
#
# Staged pipeline: lint runs first (cheap gate, fails fast); once it is green
# the four check groups run in PARALLEL, and all of them feed release. Arrows
# are `needs:` edges:
#
#            ┌── functional ──┐
#   lint ────┼── spec-gate ───┼── release (v* tags only)
#            ├── perf ────────┤
#            └── security ────┘
#
#   lint        – RuboCop. Runs first; nothing else starts until it is green.
#   functional  – RSpec (unit + security specs), Cucumber BDD, integration vs
#                 DynamoDB Local.            needs: lint
#   spec-gate   – openspec validate.         needs: lint
#   perf        – in-process benchmark (p99 budget + regression).
#                                            needs: lint
#   security    – Brakeman, bundler-audit, iam-check, security-scan
#                 (cfn-lint + checkov, STRICT).
#                                            needs: lint
#   release     – on v* tags only: sam build + packaged Lambda artifact.
#                 needs: perf, functional, spec-gate, security
#
# Ruby is pinned by the repo's .ruby-version (3.3.5); the Gemfile intentionally
# carries no `ruby` directive so the Lambda ruby3.3 managed runtime is accepted
# at deploy time.

name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

# Cancel in-flight runs for the same ref so a fast-follow push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_JOBS: 4
  BUNDLE_RETRY: 3
  # Bundler must match `BUNDLED WITH` in Gemfile.lock.
  BUNDLER_VERSION: "4.0.22"
  # Pin the OpenSpec CLI so the spec-gate is reproducible (a floating @latest
  # can add rules that fail the gate with no change to the repo). Keep in sync
  # with the locally installed version; bump deliberately.
  OPENSPEC_VERSION: "1.14.1"

jobs:
# ═════════════════════════════════════════════════════════════════════════════
# LINTING
# ═════════════════════════════════════════════════════════════════════════════
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Run RuboCop
        run: |
          bundle check
          bundle exec rubocop \
            --config .rubocop.yml \
            --format github \
            --debug

# ═════════════════════════════════════════════════════════════════════════════
# SECURITY
#
# Static analysis + dependency CVEs + the IaC/least-privilege gates. cfn-lint
# and checkov are installed here (they are not in the Ruby bundle), and
# security-scan runs with STRICT=1 so a missing scanner fails the job rather
# than silently skipping a gate.
# ═════════════════════════════════════════════════════════════════════════════
  security:
    name: Security Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Install IaC scanners (cfn-lint, checkov)
        run: pipx install cfn-lint checkov || pip install --user cfn-lint checkov

      - name: Brakeman static analysis
        run: bundle exec brakeman --no-pager -q -w2 --force

      - name: IAM least-privilege gate
        run: ruby bin/iam-check

      - name: Aggregate security scanners (bundle-audit + cfn-lint + checkov)
        env:
          STRICT: "1"
        run: ./bin/security-scan

# ═════════════════════════════════════════════════════════════════════════════
# PERFORMANCE
#
# In-process only; the deployed load test is NOT run here (it needs a live
# endpoint — run it on demand / post-deploy). The GreetAndCount#call p99 gate is
# an absolute 10 ms budget; the >20% relative regression check is floored (it
# only compares the ratio when both baseline and current p99 clear
# REGRESSION_FLOOR_MS = 5 ms), so sub-5 ms noise never trips it. The baseline is
# NOT committed (per-environment); it is cached per OS + branch so a comparison
# is always same-hardware-class.
# ═════════════════════════════════════════════════════════════════════════════
  perf:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Restore perf baseline cache
        uses: actions/cache@v5
        with:
          path: perf/baseline.json
          # Scope to the runner OS as well as the branch: a baseline is only a
          # fair comparison against one recorded on the same hardware class.
          # The leading "v2-" is the cache-schema version — bump it to discard
          # all previously cached baselines (e.g. after changing the gate).
          key: perf-baseline-v2-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            perf-baseline-v2-${{ runner.os }}-

      - name: Run in-process benchmark (absolute budget + floored regression check)
        run: bundle exec ruby perf/http_bench.rb

# ═════════════════════════════════════════════════════════════════════════════
# FUNCTIONAL TESTS
#
# The behavioural suite in one job: RSpec (unit + security specs; :integration
# is excluded until DYNAMODB_ENDPOINT is set), Cucumber BDD, then the
# integration specs against a DynamoDB Local container (-sharedDb so
# credential/region namespacing doesn't hide the table; the suite creates and
# tears down its own table per run).
# ═════════════════════════════════════════════════════════════════════════════
  functional:
    name: Functional Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      - name: Create coverage and tmp directories
        run: mkdir -p coverage tmp

      - name: RSpec (unit + security; :integration excluded)
        run: bundle exec rspec --format progress --format html --out coverage/rspec.html

      # @smoke scenarios are skipped automatically (GREETER_BASE_URL unset).
      - name: Cucumber BDD
        run: bundle exec cucumber --format progress

      - name: Start DynamoDB Local (-sharedDb)
        run: |
          docker run --rm -d --name ddb-local -p 8000:8000 \
            amazon/dynamodb-local -jar DynamoDBLocal.jar -inMemory -sharedDb
          # Wait until it answers before running the suite.
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000; then echo "ready"; break; fi
            sleep 1
          done

      - name: Integration specs (DynamoDB Local)
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_REGION: us-east-1
        run: bundle exec rspec spec/integration --format progress

      - name: Stop DynamoDB Local
        if: always()
        run: docker rm -f ddb-local || true

      - name: Upload SimpleCov HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simplecov-report
          path: coverage/
          retention-days: 14

      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: traceability-report
          path: tmp/traceability.json
          retention-days: 14

# ═════════════════════════════════════════════════════════════════════════════
# spec-gate  (OpenSpec structural validation — blocks merge if malformed)
# ═════════════════════════════════════════════════════════════════════════════
  spec-gate:
    name: OpenSpec
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install OpenSpec CLI (pinned)
        run: npm install --global "@fission-ai/openspec@${{ env.OPENSPEC_VERSION }}"

      - name: Validate all OpenSpec changes
        run: openspec validate --all --strict --json --no-interactive

# ═════════════════════════════════════════════════════════════════════════════
# release  (v* tags only — runs only if every group + spec-gate passed)
#
# greeter-http deploys as an AWS Lambda, so the "release asset" is the packaged
# SAM build artifact (the function code + its vendored gems) plus the template,
# tarred and attached to a GitHub Release. On the GitHub Ubuntu runner the host
# Ruby is 3.3.5 (via setup-ruby), matching the Lambda ruby3.3 runtime's ABI, so
# a plain `sam build` vendors gems correctly — `--use-container` is only needed
# locally when the host Ruby differs from the runtime.
# ═════════════════════════════════════════════════════════════════════════════
  release:
    name: Release HTTP artifact
    runs-on: ubuntu-latest
    needs: [perf, functional, spec-gate, security]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # required to create the Release and upload assets

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true

      # Fail the release early if GreeterHttp::VERSION and the pushed tag
      # disagree, so a deployed artifact can never misreport its own version.
      - name: Check VERSION matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"               # v0.1.0 -> 0.1.0
          const="$(bundle exec ruby -Ilib -e 'require "greeter_http/version"; print GreeterHttp::VERSION')"
          echo "tag=${tag} GreeterHttp::VERSION=${const}"
          if [ "${tag}" != "${const}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match GreeterHttp::VERSION ${const}. Bump lib/greeter_http/version.rb to ${tag} and re-tag."
            exit 1
          fi

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build the Lambda artifact
        run: sam build -t infra/template.yaml

      # Record the greeter-core version this build resolved to (from the lock,
      # the authoritative source) for the release notes.
      - name: Resolve bundled greeter-core version
        id: core
        run: |
          core_version="$(bundle exec ruby -e 'require "greeter/core"; print Greeter::Core::VERSION')"
          echo "version=${core_version}" >> "$GITHUB_OUTPUT"

      - name: Package versioned Lambda artifact
        run: |
          version="${GITHUB_REF_NAME}"
          pkg="greeter-http-${version}"
          mkdir -p "dist/${pkg}"
          # Lay the build output out at its conventional .aws-sam/build/ location
          # so the extracted directory is a normal SAM working dir: `cd` in and
          # `sam deploy --guided` just works, no --template flag needed. The
          # built template's CodeUri points at the packaged code (vendored gems
          # included). We deliberately do NOT ship the source template.yaml —
          # it would be the wrong one to deploy and only invites mistakes.
          mkdir -p "dist/${pkg}/.aws-sam"
          cp -r .aws-sam/build "dist/${pkg}/.aws-sam/build"
          cp README.md "dist/${pkg}/" 2>/dev/null || true
          tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
          ( cd dist && sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256" )
          ls -lR "dist/${pkg}"

      - name: Create GitHub Release and upload the artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/greeter-http-${{ github.ref_name }}.tar.gz
            dist/greeter-http-${{ github.ref_name }}.tar.gz.sha256
          body: |
            **greeter-http ${{ github.ref_name }}** — built against **greeter-core ${{ steps.core.outputs.version }}**.

            The tarball is a ready-to-deploy SAM build. Unpack it, `cd` in, and run
            `sam deploy --guided` (needs AWS credentials). The exact pinned
            dependency set is in the bundled `Gemfile.lock`.
          generate_release_notes: true
          fail_on_unmatched_files: true
